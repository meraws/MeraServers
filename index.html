<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeraVPN → AskaVPN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        /* Анимированные точки */
        .dots-wrapper {
            margin-bottom: 1.5rem;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            margin: 0 6px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        h1 {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: #888888;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* Карточка */
        .card {
            background: rgba(17, 17, 17, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Иконка стрелки */
        .arrow-icon {
            margin-bottom: 1.5rem;
        }

        .arrow-icon svg {
            width: 48px;
            height: 48px;
            opacity: 0.6;
        }

        .description {
            color: #cccccc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .highlight {
            color: #ffffff;
            font-weight: 500;
        }

        /* Кнопка */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: #ffffff;
            padding: 14px 36px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
            border: 1.5px solid #ffffff;
            border-radius: 40px;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.02);
        }

        .btn svg {
            transition: transform 0.3s ease;
        }

        .btn:hover svg {
            transform: translateX(4px);
        }

        /* Подсказка */
        .hint {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #555555;
            letter-spacing: 0.05em;
        }

        footer {
            margin-top: 3rem;
            color: #333333;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            h1 {
                font-size: 3rem;
                letter-spacing: 0.1em;
            }
            
            .card {
                padding: 1.8rem 1.5rem;
            }
            
            .description {
                font-size: 0.9rem;
            }
            
            .btn {
                padding: 12px 28px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>...</h1>
        
        <div class="dots-wrapper">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
        <div class="subtitle">Наш сайт переехал на другую ссылку.</div>
        
        <div class="card">
            <div class="arrow-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4L12 20M12 20L18 14M12 20L6 14" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <div class="description">
                Мы переименовали <span class="highlight">MeraVPN</span> в <span class="highlight">AskaVPN</span><br>
                и сменили домен.
            </div>
            
            <a href="https://aska.lol" class="btn" target="_blank" rel="noopener noreferrer">
                aska.lol
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            
            <div class="hint">
                нажмите для перехода
            </div>
        </div>
        
        <footer>
            MeraVPN → AskaVPN
        </footer>
    </div>
</body>
</html>
